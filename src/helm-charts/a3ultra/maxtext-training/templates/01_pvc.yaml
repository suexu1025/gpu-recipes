apiVersion: v1
kind: PersistentVolume
metadata:
  name: qinwen-training-bucket-pv
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 2048Gi
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gcsfuse-sc # dummy storage class
  claimRef:
    namespace: default
    name: qinwen-training-bucket-pvc
  mountOptions:
    - metadata-cache:ttl-secs:-1
    - metadata-cache:stat-cache-max-size-mb:-1
    - metadata-cache:type-cache-max-size-mb:-1
    - file-system:kernel-list-cache-ttl-secs:-1
    - file-cache:max-size-mb:-1
    - file-cache:enable-parallel-downloads:true
    - write:enable-streaming-writes:true

  csi:
    driver: gcsfuse.csi.storage.gke.io
    volumeHandle: tess-datasets-europe-west1 # unique bucket name
    volumeAttributes:
      skipCSIBucketAccessCheck: "true"
      gcsfuseMetadataPrefetchOnMount: "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qinwen-training-bucket-pvc
  namespace: default
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 2048Gi
  volumeName: qinwen-training-bucket-pv
  storageClassName: gcsfuse-sc # dummy storage class

